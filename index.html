<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fff4dd" />
  <meta name="description" content="Positive Fortune — one uplifting fortune a day." />
  <title>Positive Fortune</title>

  <style>
    :root {
      --cream: #fff7e7;
      --paper: #fffdf6;
      --ink: #3d291d;
      --muted: #7d6554;
      --orange: #f7a43d;
      --orange-dark: #d86420;
      --outline: #bf5119;
      --gold: #f3b649;
      --line: #ecd7b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      font-family: ui-rounded, "Nunito", "Avenir Next", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% -5%, #fffdf8 0%, transparent 38%),
        radial-gradient(circle at 0% 100%, #f9dfb0 0%, transparent 32%),
        linear-gradient(140deg, #fff9ed, #f8e3be);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(560px, 100%);
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 21px;
      font-weight: 900;
      letter-spacing: -0.06em;
    }

    .brand-mark {
      width: 18px;
      height: 18px;
      display: inline-block;
      border-radius: 60% 60% 60% 10%;
      background: linear-gradient(135deg, #ffc86f, #ed812b);
      transform: rotate(-27deg);
      box-shadow: 0 3px 7px rgba(156, 72, 20, 0.2);
    }

    h1 {
      margin: 34px 0 15px;
      font-size: clamp(40px, 9vw, 64px);
      line-height: 0.94;
      letter-spacing: -0.075em;
    }

    .intro {
      max-width: 405px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.5;
    }

    .cookie-stage {
      height: 335px;
      display: grid;
      place-items: center;
      position: relative;
      margin: 10px 0 5px;
    }

    .fortune-button {
      appearance: none;
      border: 0;
      width: 280px;
      height: 205px;
      padding: 0;
      position: relative;
      cursor: pointer;
      background: transparent;
      filter: drop-shadow(0 19px 16px rgba(98, 50, 16, 0.2));
      transition: transform 180ms ease;
    }

    .fortune-button:hover:not(:disabled) {
      transform: translateY(-7px) scale(1.025);
    }

    .fortune-button:focus-visible {
      outline: 4px solid #8a582e;
      outline-offset: 9px;
      border-radius: 45%;
    }

    .fortune-button:disabled {
      cursor: default;
    }

    .cookie-half {
      position: absolute;
      top: 37px;
      width: 154px;
      height: 130px;
      border: 4px solid var(--outline);
      background:
        radial-gradient(circle at 25% 25%, rgba(255,255,255,0.28) 0 2px, transparent 3px),
        radial-gradient(circle at 62% 58%, rgba(134,52,12,0.2) 0 2px, transparent 3px),
        linear-gradient(145deg, #ffd281 4%, #f7a43d 56%, #db6923 100%);
      box-shadow:
        inset 10px 10px 18px rgba(255, 234, 177, 0.75),
        inset -13px -9px 13px rgba(151, 52, 9, 0.22);
      z-index: 2;
    }

    .cookie-left {
      left: 2px;
      border-radius: 76% 21% 64% 40%;
      transform: rotate(17deg);
    }

    .cookie-right {
      right: 2px;
      border-radius: 21% 76% 40% 64%;
      transform: rotate(-17deg);
    }
