<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fff4dd" />
  <meta name="description" content="Positive Fortune — one uplifting fortune a day." />
  <title>Positive Fortune</title>

  <style>
    :root {
      --cream: #fff7e7;
      --paper: #fffdf6;
      --ink: #3d291d;
      --muted: #7d6554;
      --orange: #f7a43d;
      --orange-dark: #d86420;
      --outline: #bf5119;
      --gold: #f3b649;
      --line: #ecd7b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      font-family: ui-rounded, "Nunito", "Avenir Next", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% -5%, #fffdf8 0%, transparent 38%),
        radial-gradient(circle at 0% 100%, #f9dfb0 0%, transparent 32%),
        linear-gradient(140deg, #fff9ed, #f8e3be);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(560px, 100%);
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 21px;
      font-weight: 900;
      letter-spacing: -0.06em;
    }

    .brand-mark {
      width: 18px;
      height: 18px;
      display: inline-block;
      border-radius: 60% 60% 60% 10%;
      background: linear-gradient(135deg, #ffc86f, #ed812b);
      transform: rotate(-27deg);
      box-shadow: 0 3px 7px rgba(156, 72, 20, 0.2);
    }

    h1 {
      margin: 34px 0 15px;
      font-size: clamp(40px, 9vw, 64px);
      line-height: 0.94;
      letter-spacing: -0.075em;
    }

    .intro {
      max-width: 405px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.5;
    }

    .cookie-stage {
      height: 335px;
      display: grid;
      place-items: center;
      position: relative;
      margin: 10px 0 5px;
    }

    .fortune-button {
      appearance: none;
      border: 0;
      width: 280px;
      height: 205px;
      padding: 0;
      position: relative;
      cursor: pointer;
      background: transparent;
      filter: drop-shadow(0 19px 16px rgba(98, 50, 16, 0.2));
      transition: transform 180ms ease;
    }

    .fortune-button:hover:not(:disabled) {
      transform: translateY(-7px) scale(1.025);
    }

    .fortune-button:focus-visible {
      outline: 4px solid #8a582e;
      outline-offset: 9px;
      border-radius: 45%;
    }

    .fortune-button:disabled {
      cursor: default;
    }

    .cookie-half {
      position: absolute;
      top: 37px;
      width: 154px;
      height: 130px;
      border: 4px solid var(--outline);
      background:
        radial-gradient(circle at 25% 25%, rgba(255,255,255,0.28) 0 2px, transparent 3px),
        radial-gradient(circle at 62% 58%, rgba(134,52,12,0.2) 0 2px, transparent 3px),
        linear-gradient(145deg, #ffd281 4%, #f7a43d 56%, #db6923 100%);
      box-shadow:
        inset 10px 10px 18px rgba(255, 234, 177, 0.75),
        inset -13px -9px 13px rgba(151, 52, 9, 0.22);
      z-index: 2;
    }

    .cookie-left {
      left: 2px;
      border-radius: 76% 21% 64% 40%;
      transform: rotate(17deg);
    }

    .cookie-right {
      right: 2px;
      border-radius: 21% 76% 40% 64%;
      transform: rotate(-17deg);
    }

    .cookie-crease {
      position: absolute;
      z-index: 4;
      top: 99px;
      left: 97px;
      width: 87px;
      height: 9px;
      border-radius: 30px;
      background: rgba(137, 51, 12, 0.38);
      transform: rotate(-2deg);
    }

    .fortune-paper {
      position: absolute;
      z-index: 1;
      top: 76px;
      left: 89px;
      width: 103px;
      height: 91px;
      opacity: 1;
      background: linear-gradient(145deg, #fffef8, #fff4d8);
      box-shadow: 0 5px 7px rgba(75, 45, 20, 0.18);
      clip-path: polygon(13% 0, 100% 10%, 91% 100%, 0 88%);
      transform: rotate(5deg);
    }

    .fortune-paper::after {
      content: "";
      position: absolute;
      top: 29px;
      left: 13px;
      right: 13px;
      border-top: 2px solid #e9cc95;
    }

    .spark {
      position: absolute;
      z-index: 6;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      opacity: 0;
      background: var(--gold);
    }

    .spark-1 { top: 30px; left: 39px; --x: -38px; --y: -42px; }
    .spark-2 { top: 44px; right: 35px; --x: 38px; --y: -35px; }
    .spark-3 { bottom: 22px; left: 67px; --x: -34px; --y: 29px; }
    .spark-4 { bottom: 22px; right: 67px; --x: 34px; --y: 29px; }

    .fortune-button.open .cookie-left {
      animation: open-left 720ms cubic-bezier(.17,.9,.28,1) forwards;
    }

    .fortune-button.open .cookie-right {
      animation: open-right 720ms cubic-bezier(.17,.9,.28,1) forwards;
    }

    .fortune-button.open .cookie-crease {
      opacity: 0;
      transition: opacity 180ms ease;
    }

    .fortune-button.open .fortune-paper {
      animation: paper-rise 700ms 130ms cubic-bezier(.2,.9,.2,1) forwards;
    }

    .fortune-button.open .spark {
      animation: sparkle 700ms ease-out forwards;
    }

    .fortune-button.open .spark-2 { animation-delay: 80ms; }
    .fortune-button.open .spark-3 { animation-delay: 140ms; }
    .fortune-button.open .spark-4 { animation-delay: 110ms; }

    .fortune-card {
      display: none;
      max-width: 490px;
      margin: 0 auto 18px;
      padding: 26px 24px;
      border: 1px solid var(--line);
      border-radius: 23px;
      background: rgba(255, 253, 246, 0.88);
      box-shadow: 0 18px 36px rgba(104, 57, 21, 0.13);
      backdrop-filter: blur(10px);
    }

    .fortune-card.show {
      display: block;
      animation: card-rise 460ms ease both;
    }

    .eyebrow {
      color: #bc6a29;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .fortune-message {
      margin: 12px 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(25px, 5vw, 33px);
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: -0.04em;
    }

    .status {
      min-height: 24px;
      color: #896346;
      font-size: 14px;
      font-weight: 800;
    }

    .next-fortune {
      min-height: 22px;
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
    }

    .footer {
      margin-top: 23px;
      color: #a1846b;
      font-size: 12px;
    }

    .footer span {
      color: #e5862c;
    }

    @keyframes open-left {
      to {
        transform: translate(-76px, -25px) rotate(-28deg);
      }
    }

    @keyframes open-right {
      to {
        transform: translate(76px, -25px) rotate(28deg);
      }
    }

    @keyframes paper-rise {
      from {
        opacity: 0;
        transform: rotate(5deg) scale(0.62);
      }
      to {
        opacity: 1;
        transform: translateY(-54px) rotate(-4deg) scale(1);
      }
    }

    @keyframes sparkle {
      20% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(var(--x), var(--y)) scale(0.2);
      }
    }

    @keyframes card-rise {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      Positive Fortune
    </div>

    <h1>A little good news<br />for your day.</h1>

    <p class="intro">
      One gentle reminder, made just for today.
      Crack open your cookie when you are ready.
    </p>

    <div class="cookie-stage">
      <button
        id="fortuneButton"
        class="fortune-button"
        aria-label="Open today’s positive fortune"
      >
        <span class="fortune-paper" aria-hidden="true"></span>
        <span class="cookie-half cookie-left" aria-hidden="true"></span>
        <span class="cookie-half cookie-right" aria-hidden="true"></span>
        <span class="cookie-crease" aria-hidden="true"></span>

        <span class="spark spark-1" aria-hidden="true"></span>
        <span class="spark spark-2" aria-hidden="true"></span>
        <span class="spark spark-3" aria-hidden="true"></span>
        <span class="spark spark-4" aria-hidden="true"></span>
      </button>
    </div>

    <section id="fortuneCard" class="fortune-card" aria-live="polite">
      <div class="eyebrow">Your fortune for today</div>
      <p id="fortuneMessage" class="fortune-message"></p>
    </section>

    <div id="status" class="status">Your next fortune is waiting.</div>
    <div id="nextFortune" class="next-fortune">One fortune, once a day.</div>

    <div class="footer">
      Made to brighten one moment. <span>✦</span>
    </div>
  </main>

  <script>
    const fortunes = [
    "You are the human equivalent of a participation trophy."
    "I can explain it to you, but I can't understand it for you."
    "Your birth certificate is an apology letter from the condom factory."
    "You’re like a software update—whenever I see you, I think, 'Not now.'
    "I'd agree with you, but then we'd both be wrong."
    "You are proof that evolution can go in reverse."
    "I envy everyone who hasn't met you yet."
    "You have a face made for radio and a voice made for silent films."
    "I’d like to see things from your point of view, but I can't seem to get my head that far up my own ass."
    "You bring a unique lack of flavor to everything you do."
    "If I gave you a penny for your thoughts, I'd get change back."
    "You’re not the dumbest person in the world, but you better hope they don't die."
    "Shock me. Say something intelligent."
    "You have a massive gap between your ears that nature forgot to fill."
    "You will live a long, lonely life, surrounded only by the cats that tolerate you."
    "A thrilling adventure awaits you... tomorrow, when you finally get off the couch."
    "The stars have aligned, and they all agree you are the problem."
    "An inheritance is in your future. Unfortunately, it is your parents' debt."
    
    ];

    const storageKey = "positive-fortune-daily-v1";

    const fortuneButton = document.getElementById("fortuneButton");
    const fortuneCard = document.getElementById("fortuneCard");
    const fortuneMessage = document.getElementById("fortuneMessage");
    const status = document.getElementById("status");
    const nextFortune = document.getElementById("nextFortune");

    function getToday() {
      return new Date().toLocaleDateString("en-CA");
    }

    function getTomorrow() {
      const tomorrow = new Date();
      tomorrow.setHours(24, 0, 0, 0);
      return tomorrow;
    }

    function formatTimeUntilTomorrow() {
      const milliseconds = getTomorrow() - new Date();
      const totalMinutes = Math.max(0, Math.ceil(milliseconds / 60000));
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;

      if (hours > 0) {
        return `${hours}h ${minutes}m until tomorrow`;
      }

      return `${minutes}m until tomorrow`;
    }

    function chooseDailyFortune(seed) {
      let hash = 0;

      for (let i = 0; i < seed.length; i++) {
        hash = ((hash << 5) - hash) + seed.charCodeAt(i);
        hash |= 0;
      }

      const index = Math.abs(hash) % fortunes.length;
      return fortunes[index];
    }

    function getSavedFortune() {
      try {
        return JSON.parse(localStorage.getItem(storageKey));
      } catch {
        return null;
      }
    }

    function saveFortune(text) {
      try {
        localStorage.setItem(
          storageKey,
          JSON.stringify({
            date: getToday(),
            message: text
          })
        );
      } catch {
        // The site still works if browser storage is unavailable.
      }
    }

    function revealFortune(message) {
      fortuneButton.classList.add("open");
      fortuneButton.disabled = true;

      fortuneMessage.textContent = `“${message}”`;
      fortuneCard.classList.add("show");

      status.textContent = "Come back tomorrow for another bright thought.";
      nextFortune.textContent = formatTimeUntilTomorrow();
    }

    function loadDailyFortune() {
      const saved = getSavedFortune();

      if (saved && saved.date === getToday() && saved.message) {
        revealFortune(saved.message);
      }
    }

    fortuneButton.addEventListener("click", () => {
      const message = chooseDailyFortune(getToday());
      saveFortune(message);
      revealFortune(message);
    });

    setInterval(() => {
      const saved = getSavedFortune();

      if (saved && saved.date === getToday()) {
        nextFortune.textContent = formatTimeUntilTomorrow();
      }
    }, 30000);

    loadDailyFortune();
  </script>
</body>
</html>
